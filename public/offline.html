<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#faf6ee" />
  <title>MYAH — you're offline</title>
  <link rel="icon" href="/images/favicon.png" />
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#faf6ee; color:#2c1a0e; font-family:"Montserrat","Helvetica Neue",Arial,sans-serif; padding:24px 16px; box-sizing:border-box; text-align:center; }
    main { max-width:420px; }
    img { width:72px; height:72px; display:block; margin:0 auto 22px; }
    .brand { font-weight:500; letter-spacing:.28em; color:#2f5d45; font-size:1.1rem; margin:0 0 4px; }
    .tag { font-family:"Lato","Helvetica Neue",Arial,sans-serif; font-weight:700; font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:#8a6a4f; margin:0 0 28px; }
    h1 { font-family:"Marcellus",Georgia,serif; font-weight:400; font-size:1.8rem; line-height:1.2; margin:0 0 12px; }
    p.copy { color:#6b4e35; font-size:.98rem; line-height:1.75; margin:0 0 26px; }
    button { font:inherit; font-size:.8rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#fff; background:#2f5d45; border:0; border-radius:999px; padding:15px 30px; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <p class="brand">MYAH</p>
    <p class="tag">Make Yourself At Home</p>
    <h1>You are offline</h1>
    <p class="copy">MYAH needs a connection to load this page. Check your wifi or signal, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
